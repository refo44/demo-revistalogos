# Weekly update PRs for root Composer (dev/test only) and GitHub Actions.
# Opens PRs only. No auto-merge. CI (test.yml) + owner review required.
# Does not deploy. Does not cover npm, Docker, or WordPress plugins/themes.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
