# Manual WordPress deployment to PRODUCTION (ADR 0009; prompt §14 Phase 13).
#
# Hard rules encoded here:
# - workflow_dispatch ONLY: no push/pull_request/schedule/tag triggers and
#   no automatic promotion. Creating or validating this workflow does not
#   authorize executing it; every run needs an explicit owner decision.
# - ADR 0020: the GitHub ref itself must be an annotated
#   vMAJOR.MINOR.PATCH tag (refs/tags/vX.Y.Z). Merge to main is not a
#   deploy. Run the workflow from that tag, never from main — even when
#   main's tip is tagged. Still no on.push tags (that would auto-promote).
# - Scope is exactly the first-party theme and plugin directories. It
#   never touches wp-content/uploads/, wp-config.php, WordPress core,
#   database content, third-party plugins or the server-root .htaccess,
#   and it never activates anything or runs migrations/fixtures.
# - FTPS with dangerous-clean-slate disabled and no delete/mirror mode
#   against shared WordPress directories; each artifact goes to its own
#   bounded remote directory (never the WordPress installation root).
# - setup-php in this workflow configures ONLY the GitHub Actions runner
#   that runs Composer. It does NOT change cPanel, CloudLinux PHP
#   Selector, MultiPHP, or the production PHP 8.3 already in use.
#
# Required production secrets (see docs/operations/wordpress-manual-deployment.md):
#   PRODUCTION_FTP_SERVER, PRODUCTION_FTP_USERNAME, PRODUCTION_FTP_PASSWORD,
#   PRODUCTION_THEME_REMOTE_DIR, PRODUCTION_PLUGIN_REMOTE_DIR
name: Deploy WordPress theme+plugin to production

on:
  workflow_dispatch:

concurrency:
  group: deploy-wordpress-production
  cancel-in-progress: false

jobs:
  require-release-tag:
    name: Require annotated release tag
    runs-on: ubuntu-latest

    steps:
      - name: Refuse branch refs
        if: github.ref_type != 'tag'
        run: |
          echo "Production deploy must be dispatched from a tag vMAJOR.MINOR.PATCH (ADR 0020)." >&2
          echo "This run used: ${GITHUB_REF} (${GITHUB_REF_TYPE})." >&2
          echo "Actions → Run workflow → Use workflow from → Tags → vX.Y.Z. Do not choose main." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, not depth 1: the gate also verifies that the tagged
          # commit is reachable from main, which a shallow clone cannot answer.
          fetch-depth: 0
          fetch-tags: true

      # Explicit, so the gate never fails for want of a ref: the run is
      # dispatched from a tag, and the reachability check needs main present
      # regardless of how checkout resolved refspecs.
      - name: Fetch main for the reachability check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Ref must be a tag vMAJOR.MINOR.PATCH on main
        env:
          GITHUB_REF: ${{ github.ref }}
        run: ./tools/require-production-release-tag.sh

  deploy-theme:
    name: Upload theme via FTPS
    runs-on: ubuntu-latest
    environment: wordpress-production
    needs: require-release-tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy theme directory
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PRODUCTION_FTP_SERVER }}
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wordpress/wp-content/themes/revistalogos/
          server-dir: ${{ secrets.PRODUCTION_THEME_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store

  deploy-plugin:
    name: Upload plugin via FTPS
    runs-on: ubuntu-latest
    environment: wordpress-production
    needs:
      - require-release-tag
      - deploy-theme

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Runner-only: build vendor/ on Actions. Does not change hosting PHP.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom
          coverage: none
          tools: composer

      - name: Install plugin runtime dependencies
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Deploy plugin directory
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PRODUCTION_FTP_SERVER }}
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wordpress/wp-content/plugins/revistalogos-core/
          server-dir: ${{ secrets.PRODUCTION_PLUGIN_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.DS_Store
            **/.qa-*.php
