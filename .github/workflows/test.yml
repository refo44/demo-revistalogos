# PHPUnit unit tests (Testing Foundation, ADR 0018).
#
# Comprobar no es desplegar: no FTPS, no Pages, no production environment,
# no secrets. Does not close D12b (security-audit automation). WordPress
# integration remains isolated tools/qa-*.sh until a PHPUnit integration
# suite is added.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-unit:
    name: PHPUnit unit (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.2-

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Run unit tests
        run: composer test:unit
