# PHP lint, Composer lockfile audit, PHPUnit units (Testing Foundation, ADR 0018).
#
# Comprobar no es desplegar: no FTPS, no Pages, no production environment,
# no secrets. Does not close D12b (security-audit automation). WordPress
# integration remains isolated tools/qa-*.sh until a PHPUnit integration
# suite is added. Root composer audit covers test tooling. Plugin
# composer audit covers runtime Dompdf (ADR 0017 WU4). Does not run
# SonarScanner: Automatic Analysis is ON (.sonarcloud.properties).
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint-and-unit:
    name: PHP lint, Composer audit, and unit (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.lock', 'wordpress/wp-content/plugins/revistalogos-core/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install plugin runtime dependencies
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core install --no-interaction --prefer-dist --no-progress

      - name: Validate plugin composer.json and composer.lock
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core validate --no-check-publish

      - name: PHP syntax lint
        run: composer lint:php

      - name: Composer dependency audit
        run: composer audit --locked

      - name: Plugin Composer dependency audit
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core audit --locked

      - name: Run unit tests
        run: composer test:unit
