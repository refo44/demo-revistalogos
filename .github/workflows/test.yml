# PHP lint, Composer lockfile audit, PHPUnit units (Testing Foundation, ADR 0018)
# and Stylelint over the two CSS trees.
#
# The CSS job exists because nothing in CI ran Node until now: `lint:css`, the
# `engines` floor, and every lockfile change were verified only on whatever
# machine happened to run them. It resolves its Node from `.nvmrc` so CI and
# the laptop agree.
#
# Comprobar no es desplegar: no FTPS, no Pages, no production environment,
# no secrets. Does not close D12b (security-audit automation). WordPress
# integration remains isolated tools/qa-*.sh until a PHPUnit integration
# suite is added. Root composer audit covers test tooling. Plugin
# composer audit covers runtime Dompdf (ADR 0017 WU4).
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint-and-unit:
    name: PHP lint, Composer audit, and unit (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.lock', 'wordpress/wp-content/plugins/revistalogos-core/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install plugin runtime dependencies
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core install --no-interaction --prefer-dist --no-progress

      - name: Validate plugin composer.json and composer.lock
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core validate --no-check-publish

      - name: PHP syntax lint
        run: composer lint:php

      - name: Composer dependency audit
        run: composer audit --locked

      - name: Plugin Composer dependency audit
        run: composer --working-dir=wordpress/wp-content/plugins/revistalogos-core audit --locked

      - name: Run unit tests
        run: composer test:unit

  css-lint:
    name: Stylelint (Node from .nvmrc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # node-version-file reads .nvmrc, so CI and the developer laptop resolve
      # the same version. package.json `engines` requires >=20.19.0 (stylelint
      # 17 and the @csstools tree); npm reports EBADENGINE below that.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # `npm ci` installs strictly from the lockfile and fails when it has
      # drifted from package.json, which `npm install` would instead paper
      # over by rewriting the lockfile in place.
      #
      # --ignore-scripts keeps dependency lifecycle scripts from executing on
      # the runner (Sonar githubactions:S6505). Stylelint is pure JavaScript
      # with nothing to build at install time, so the lint runs unchanged.
      - name: Install dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Lint CSS
        run: npm run lint:css
